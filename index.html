<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokalny Fachowiec</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=PT+Sans+Narrow:wght@400;700&family=Science+Gothic:wght@100..900&family=Tektur:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="upper-nav">
            <img src="images/logo.png" alt="Logo" width="80" height="80">
            <img src="images/lokalnyfachowiec_text.png" alt="Lokalny Fachowiec" width="250" height="80">
            </form>
            <button id="calc-btn">Kalkulator Cen</button>
            <button id="log-btn">Rejestracja/Logowanie</button>
        </div>
    </nav>


    
    <aside id="sidebar">
        <h2>Filtry</h2>
        <label for="filter-keyword">Szukaj:</label>
        <input type="text" id="filter-keyword" placeholder="Wpisz słowo kluczowe...">

        <p><label for="filter-category">Kategoria:</label>
        <select id="filter-category">
            <option value="">Wszystkie</option>
            <option value="elektryk">Elektryk</option>
            <option value="hydraulik">Hydraulik</option>
            <option value="stolarz">Stolarz</option>

        </select>
                <p><label for="filter-category">Lokalizacja:</label>
        <select id="filter-category">
            <option value="">Gdańsk</option>
            <option value="elektryk">Warszawa</option>
            <option value="hydraulik">Kraków</option>
            <option value="stolarz">Wrocław</option>

        </select>
        <p>
            <label for="filter-price">Stawka za godzinę:</label>
            <span id="price-val">250 zł</span>
        </p>
        <input id="filter-price" type="range" min="0" max="500" step="1" value="250">

        <p><label for="filter-rating-from">Ocena od:</label></p>
        <select id="filter-rating-from">
            <option value="0">Dowolna</option>
            <option value="1">★ 1.0</option>
            <option value="2">★ 2.0</option>
            <option value="3">★ 3.0</option>
            <option value="3.5">★ 3.5</option>
            <option value="4">★ 4.0</option>
            <option value="4.5">★ 4.5</option>
            <option value="4.8">★ 4.8</option>
            <option value="5">★ 5.0</option>
        </select>
        <p><label for="filter-rating-to">Ocena do:</label></p>
        <select id="filter-rating-to">
            <option value="5">★ 5.0</option>
            <option value="4.8">★ 4.8</option>
            <option value="4.5">★ 4.5</option>
            <option value="4">★ 4.0</option>
            <option value="3.5">★ 3.5</option>
            <option value="3">★ 3.0</option>
            <option value="2">★ 2.0</option>
            <option value="1">★ 1.0</option>
        </select>

        <p>
            <label for="filter-experience">Staż:</label>
            <span id="experience-val">0 lat</span>
        </p>
        <input id="filter-experience" type="range" min="0" max="30" step="1" value="0">
    </aside>


</body>
</html>
