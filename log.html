<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Rejestracja i logowanie | Lokalny Fachowiec</title>
	<link rel="stylesheet" href="style.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=PT+Sans+Narrow:wght@400;700&family=Science+Gothic:wght@100..900&family=Tektur:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>
	<nav>
		<div class="upper-nav">
			<img src="images/logo.png" alt="Logo" width="80" height="80">
			<img src="images/lokalnyfachowiec_text.png" alt="Lokalny Fachowiec" width="250" height="80">
			<a class="auth-back" href="index.html">Strona główna</a>
		</div>
	</nav>

	<main class="auth-main">
		<h2>Rejestracja i logowanie</h2>
		<div class="auth-switch" aria-label="Wybierz formularz">
			<button type="button" id="login-tab" class="active" aria-pressed="true">Logowanie</button>
			<button type="button" id="register-tab" aria-pressed="false">Rejestracja</button>
		</div>

		<form id="login-form" class="auth-form">
			<label for="login-email">Adres e-mail:</label>
			<input id="login-email" name="email" type="email" autocomplete="email" required>

			<label for="login-password">Hasło:</label>
			<input id="login-password" name="password" type="password" autocomplete="current-password" required>

			<button type="submit">Zaloguj się</button>
		</form>

		<form id="register-form" class="auth-form" hidden>
			<label for="register-first-name">Imię:</label>
			<input id="register-first-name" name="firstName" type="text" autocomplete="given-name" maxlength="100" required>

			<label for="register-last-name">Nazwisko:</label>
			<input id="register-last-name" name="lastName" type="text" autocomplete="family-name" maxlength="100" required>

			<label for="register-email">Adres e-mail:</label>
			<input id="register-email" name="email" type="email" autocomplete="email" maxlength="255" required>

			<label for="register-phone">Numer telefonu:</label>
			<input id="register-phone" name="phone" type="tel" autocomplete="tel" maxlength="50" required>

			<label for="register-role">Typ konta:</label>
			<select id="register-role" name="role" required>
				<option value="">Wybierz typ konta</option>
				<option value="majster">Majster</option>
				<option value="brygada">Brygada</option>
				<option value="firma">Firma</option>
			</select>

			<label for="register-city">Miasto:</label>
			<input id="register-city" name="city" type="text" autocomplete="address-level2" maxlength="100">

			<label for="register-description">Opis:</label>
			<textarea id="register-description" name="description" rows="4" maxlength="65535"></textarea>

			<label for="register-password">Hasło (od 8 do 128 znaków):</label>
			<input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>

			<button type="submit">Utwórz konto</button>
		</form>
		<p id="auth-message" class="auth-message" aria-live="polite"></p>
	</main>

	<footer>
		<p>&copy; 2026 Lokalny Fachowiec. Wszelkie prawa zastrzeżone.</p>
		<p>Autorzy: Ivan Mulitsa &amp; Yevhenii Pustovoit</p>
	</footer>

	<script>
		const loginTab = document.getElementById('login-tab');
		const registerTab = document.getElementById('register-tab');
		const loginForm = document.getElementById('login-form');
		const registerForm = document.getElementById('register-form');
		const authMessage = document.getElementById('auth-message');
		const apiUrl = 'https://lokalny-fachowiec-api.onrender.com';

		function showForm(isLogin) {
			loginForm.hidden = !isLogin;
			registerForm.hidden = isLogin;
			loginTab.classList.toggle('active', isLogin);
			registerTab.classList.toggle('active', !isLogin);
			loginTab.setAttribute('aria-pressed', String(isLogin));
			registerTab.setAttribute('aria-pressed', String(!isLogin));
			authMessage.textContent = '';
		}

		loginTab.addEventListener('click', () => showForm(true));
		registerTab.addEventListener('click', () => showForm(false));

		loginForm.addEventListener('submit', (event) => {
			event.preventDefault();
			authMessage.textContent = 'Logowanie nie jest jeszcze dostępne.';
		});

		registerForm.addEventListener('submit', async (event) => {
			event.preventDefault();
			authMessage.textContent = 'Tworzenie konta...';
			const submitButton = registerForm.querySelector('button[type="submit"]');
			submitButton.disabled = true;

			const formData = new FormData(registerForm);
			const payload = Object.fromEntries(formData.entries());

			try {
				const response = await fetch(`${apiUrl}/api/register`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(payload),
				});
				const result = await response.json();

				if (!response.ok) {
					throw new Error(result.error || 'Nie udało się utworzyć konta.');
				}

				registerForm.reset();
				showForm(true);
				authMessage.textContent = 'Konto zostało utworzone. Możesz się zalogować.';
			} catch (error) {
				authMessage.textContent = error.message || 'Nie można połączyć się z serwerem.';
			} finally {
				submitButton.disabled = false;
			}
		});
	</script>
</body>
</html>
